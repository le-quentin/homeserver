---
- name: Setup AdGuard Home (DNS for LAN + filters for WAN)
  hosts: adguard
  tasks:
    - name: Ensure docker is installed
      ansible.builtin.include_tasks: "tasks/install-docker.yaml"
    - name: Copy systemd-resolved conf file over (turning off TCP 53 listen to free it for AdGuard)
      become: true
      ansible.builtin.copy:
        src: "{{ playbooks_root }}/resources/adguard/systemd-resolved.conf"
        dest: "/etc/systemd/resolved.conf"
        mode: "0644"
      notify: Restart systemd-resolved
    - name: Restart systemd-resolved immediately if needed to free the TCP port
      ansible.builtin.meta: flush_handlers
    # Not recursive: AdGuard sets the modes of its own files (its config holds the password hash)
    - name: Ensure work and conf folders exist
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ home_dir }}/work"
          mode: "0700"
        - path: "{{ home_dir }}/conf"
          mode: "0755"
    - name: Ensure config folder exists
      ansible.builtin.file:
        path: "{{ ansible_files_root }}/adguard"
        state: directory
        mode: "0755"
    - name: Copy files
      notify:
        - Run AdGuard-Home
      block:
        - name: Interpret docker compose template
          ansible.builtin.template:
            src: "{{ playbooks_root }}/resources/adguard/compose.yaml.j2"
            dest: "{{ ansible_files_root }}/adguard/compose.yaml"
            mode: "0644"
        - name: Interpret AdGuard configuration file
          become: true
          ansible.builtin.template:
            src: "{{ playbooks_root }}/resources/adguard/config.yaml.j2"
            dest: "{{ home_dir }}/conf/AdGuardHome.yaml"
            mode: "0600" # as AdGuard writes it back: it holds the password hash
            backup: true
  handlers:
    - name: Restart systemd-resolved
      become: true
      ansible.builtin.systemd:
        name: "systemd-resolved"
        enabled: true
        state: restarted
    - name: Run AdGuard-Home
      become: true
      community.docker.docker_compose_v2:
        project_src: "{{ ansible_files_root }}/adguard"
        recreate: always # so that changes in config are applied
