- name: "Install slsk-batchdl"
  hosts: servarr
  tasks:
    - name: "ensure config dir exists"
      become: true
      ansible.builtin.file:
        path: /srv/tools/slsk-batchdl/config
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ default_admin_group }}"
        mode: "{{ default_admin_dir_mode }}"
    - name: "render config template"
      become: true
      ansible.builtin.template:
        src: "{{ playbooks_root }}/apps/slskd/batchdl/sldl.conf.j2"
        dest: "/srv/tools/slsk-batchdl/config/sldl.conf"
        group: "{{ default_admin_group }}"
        mode: "{{ default_admin_file_mode }}"
      notify: Stop slsk-batchdl
    - name: "render compose template"
      become: true
      ansible.builtin.template:
        src: "{{ playbooks_root }}/apps/slskd/batchdl/compose.yml.j2"
        dest: "/srv/tools/slsk-batchdl/compose.yml"
        group: "{{ default_admin_group }}"
        mode: "{{ default_admin_file_mode }}"
      notify: Stop slsk-batchdl
  handlers:
    # slsk-batchdl is stopped by default: a config change takes it down instead of restarting it.
    # Start it by hand when needed: docker compose -f /srv/tools/slsk-batchdl/compose.yml up -d
    # and take it down afterwards:   docker compose -f /srv/tools/slsk-batchdl/compose.yml down
    - name: Stop slsk-batchdl
      community.docker.docker_compose_v2:
        project_src: /srv/tools/slsk-batchdl
        state: absent
