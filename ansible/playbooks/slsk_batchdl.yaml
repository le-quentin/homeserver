---
# slsk-batchdl was removed (it downloaded Spotify playlists from Soulseek, done long ago). This play removes
# what it left on the host; delete it once it has run on apps_vm.
# Its downloads are kept if there are any: check /srv/tools/slsk-batchdl/data and delete it by hand.
- name: "Remove slsk-batchdl"
  hosts: apps_vm
  vars:
    slsk_batchdl_dir: /srv/tools/slsk-batchdl
  tasks:
    - name: "check whether slsk-batchdl is still deployed"
      ansible.builtin.stat:
        path: "{{ slsk_batchdl_dir }}/compose.yml"
      register: slsk_batchdl_compose
    - name: "remove its containers and network"
      community.docker.docker_compose_v2:
        project_src: "{{ slsk_batchdl_dir }}"
        state: absent
      when: slsk_batchdl_compose.stat.exists
    - name: "remove its image"
      community.docker.docker_image:
        name: lequentindckr/slsk-batchdl
        tag: v2.4.7
        state: absent
    - name: "look for downloads left in its data dir"
      ansible.builtin.find:
        paths: "{{ slsk_batchdl_dir }}/data"
        file_type: any
      register: slsk_batchdl_data
    - name: "remove its files (compose, config with the Soulseek and Spotify credentials)"
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ [slsk_batchdl_dir] if slsk_batchdl_data.matched == 0 else [slsk_batchdl_dir + '/compose.yml', slsk_batchdl_dir + '/config'] }}"
    - name: "report downloads left behind"
      ansible.builtin.debug:
        msg: "{{ slsk_batchdl_data.matched }} entries left in {{ slsk_batchdl_dir }}/data: check them, then delete the directory by hand"
      when: slsk_batchdl_data.matched > 0
